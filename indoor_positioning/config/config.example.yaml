# Indoor Positioning System -- runtime configuration.
# Copy to config.yaml and edit for your robot.

camera:
  source: gopro_usb         # gopro_usb | opencv | file
  device: /dev/video0       # V4L2 device the GoPro webcam endpoint exposes
  width: 1920
  height: 1080
  fps: 30
  # Where the camera sits on the robot body (metres / degrees).
  # Body frame: +x forward, +y left, +z up; origin at the drive centre.
  mount_x: 0.0
  mount_y: 0.0
  mount_z: 0.30             # camera 30 cm above the body origin
  mount_yaw_deg: 0.0        # rotate if the lens does not face forward
  mount_pitch_deg: 90.0     # 90 => camera looks straight up at the ceiling
  mount_roll_deg: 0.0

detector:
  dictionary: DICT_4X4_50   # must match the markers you printed
  marker_length_m: 0.15     # printed side length of the black square
  max_reprojection_error_px: 4.0
  refine_corners: true

odometry:
  enabled: true
  max_features: 200
  quality_level: 0.01
  min_distance_px: 12.0
  flow_scale_m: 0.5         # tune so VO distance roughly matches reality
  min_tracked_features: 12

fusion:
  process_std_xy: 0.05      # m per prediction step
  process_std_theta: 0.02   # rad per prediction step
  marker_std_xy: 0.04       # base marker position noise (m)
  marker_std_theta: 0.03    # base marker heading noise (rad)
  mahalanobis_gate: 9.21    # reject marker fixes beyond this (chi2, 2 dof @0.99)
  initial_std_xy: 2.0
  initial_std_theta: 3.14159

output:
  publish: true
  protocol: udp             # udp | tcp
  host: 255.255.255.255     # UDP broadcast; set to a specific IP for TCP
  port: 9870
  rate_hz: 30.0
  log_enabled: true
  log_path: pose_log.jsonl
